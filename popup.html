<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>owlEyes</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <span class="brand">owlEyes</span>
        <label class="switch">
            <input type="checkbox" id="enabled-toggle">
            <span class="slider"></span>
        </label>
    </header>

    <section id="current-tag">
        <h3>Tag page</h3>
        <input type="text" id="identifier" placeholder="Current selection / URL...">
        <div id="label-select"></div>
        <button id="apply-btn" disabled>Apply</button>
    </section>

    <footer>
        <button id="options-btn">Manage labels &amp; gists</button>
    </footer>

    <script src="browser-polyfill.js"></script>
    <script src="popup.js"></script>
</body>
</html>
